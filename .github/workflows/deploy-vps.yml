name: Deploy VPS MCP Controller

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-tce-k3s-01
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: tce-k3s-01
    steps:
      - name: Checkout selected master revision
        uses: actions/checkout@v4

      - name: Validate immutable source revision
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require reviewed OAuth production approval
        env:
          MCP_OAUTH_PRODUCTION_READY: ${{ vars.MCP_OAUTH_PRODUCTION_READY }}
        run: |
          set -euo pipefail
          if [[ "${MCP_OAUTH_PRODUCTION_READY,,}" != "true" ]]; then
            echo "::error::Production deploy is locked. Set MCP_OAUTH_PRODUCTION_READY=true only after OAuth 2.1/PKCE and MCP authorization metadata pass independent security review."
            exit 78
          fi

      - name: Configure strict SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test "$VPS_USER" != "root"
          test "$VPS_SSH_PORT" = "22"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vps_deploy ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/vps_deploy >/dev/null
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Verify remote target and trusted deploy sources
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GHCR_READ_TOKEN"
          SSH=(ssh -i ~/.ssh/vps_deploy -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts)
          TARGET="$VPS_USER@$VPS_HOST"

          REMOTE_UID="$("${SSH[@]}" "$TARGET" 'id -u')"
          if [[ ! "$REMOTE_UID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::SSH must use a non-root deploy account."
            exit 1
          fi

          "${SSH[@]}" "$TARGET" 'sudo -n /usr/local/sbin/vps-mcp-deploy --preflight'

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable multi-architecture gateway image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file apps/mcp-gateway/Dockerfile \
            --tag ghcr.io/phanthienquoc/vps-mcp-controller:${GITHUB_SHA} \
            --push .

      - name: Invoke root-owned deploy entrypoint
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GHCR_READ_TOKEN"

          SSH=(ssh -i ~/.ssh/vps_deploy -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts)

          printf '%s' "$GHCR_READ_TOKEN" | "${SSH[@]}" "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/vps-mcp-deploy '$GITHUB_SHA'"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### VPS MCP deployment succeeded"
            echo "- Target node: tce-k3s-01"
            echo "- Revision: ${GITHUB_SHA}"
            echo "- Image: ghcr.io/phanthienquoc/vps-mcp-controller:${GITHUB_SHA}"
            echo "- Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
