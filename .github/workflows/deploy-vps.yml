name: Deploy VPS MCP Controller

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: deploy-tce-k3s-01
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: tce-k3s-01
    steps:
      - name: Checkout selected master revision
        uses: actions/checkout@v4

      - name: Validate immutable source and deployment gates
        env:
          MCP_OAUTH_PRODUCTION_READY: ${{ vars.MCP_OAUTH_PRODUCTION_READY }}
          VPS_TARGET_ID: ${{ vars.VPS_TARGET_ID }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          GH_TOKEN: ${{ github.token }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          CI_RUNS="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" -f head_sha="$GITHUB_SHA" -f branch=master -F per_page=50)"
          CI_RUN="$(jq -c --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha and .head_branch == "master" and .event == "push")' <<< "$CI_RUNS" | tail -n 1)"
          if [[ -z "$CI_RUN" ]]; then
            echo "::error::No CI push run exists for the exact selected master commit."
            exit 1
          fi
          if [[ "$(jq -r '.status' <<< "$CI_RUN")" != "completed" || "$(jq -r '.conclusion' <<< "$CI_RUN")" != "success" ]]; then
            echo "::error::CI for the exact selected master commit has not completed successfully."
            exit 1
          fi
          echo "Verified successful CI run $(jq -r '.id' <<< "$CI_RUN") for the selected immutable commit."

          test "$MCP_OAUTH_PRODUCTION_READY" = "true"
          test "$VPS_TARGET_ID" = "tce-k3s-01"
          test -n "$VPS_HOST"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          test -n "$VPS_USER"
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test "$VPS_USER" != "root"
          test "$VPS_SSH_PORT" = "22"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$GHCR_READ_TOKEN"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Configure strict SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vps_deploy ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/vps_deploy >/dev/null
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS

      - name: Run read-only VPS preflight before publishing
        env:
          VPS_TARGET_ID: ${{ vars.VPS_TARGET_ID }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/vps_deploy" -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          PREFLIGHT_OUTPUT="$("${SSH[@]}" "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/sbin/vps-mcp-preflight")"
          SUMMARY="$(printf '%s\n' "$PREFLIGHT_OUTPUT" | grep '^Summary:' | tail -n 1)"
          test -n "$SUMMARY"
          if ! grep -Fq "Expected node ${VPS_TARGET_ID} is Ready" <<< "$PREFLIGHT_OUTPUT"; then
            echo "::error::Read-only VPS preflight did not confirm the configured target node."
            exit 1
          fi
          printf 'Read-only VPS preflight passed for %s: %s\n' "$VPS_TARGET_ID" "$SUMMARY"

      - name: Build and publish immutable multi-architecture gateway image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file apps/mcp-gateway/Dockerfile \
            --tag ghcr.io/phanthienquoc/vps-mcp-controller:${GITHUB_SHA} \
            --push .

      - name: Invoke root-owned deploy entrypoint
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/vps_deploy" -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          printf '%s' "$GHCR_READ_TOKEN" | "${SSH[@]}" "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/vps-mcp-deploy '$GITHUB_SHA'"
          unset GHCR_READ_TOKEN

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### VPS MCP deployment succeeded"
            echo "- Target: ${VPS_TARGET_ID}"
            echo "- Revision: ${GITHUB_SHA}"
            echo "- Image: ghcr.io/phanthienquoc/vps-mcp-controller:${GITHUB_SHA}"
            echo "- Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
