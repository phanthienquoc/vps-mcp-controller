apiVersion: apps/v1
kind: Deployment
metadata:
  name: vps-mcp-gateway
  namespace: ops-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vps-mcp-gateway
  template:
    metadata:
      labels:
        app: vps-mcp-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 34001
        fsGroup: 34001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/phanthienquoc/vps-mcp-controller:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MCP_ALLOWED_HOST
              value: mcp.mrcute.space
            - name: ROOT_AGENT_SOCKET
              value: /run/vps-mcp/root-agent.sock
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vps-mcp-secrets
                  key: mcp-bearer-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: root-agent-socket
              mountPath: /run/vps-mcp
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: root-agent-socket
          hostPath:
            path: /run/vps-mcp
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
