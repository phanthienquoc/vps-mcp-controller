apiVersion: apps/v1
kind: Deployment
metadata:
  name: vps-mcp-gateway
  namespace: ops-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vps-mcp-gateway
  template:
    metadata:
      labels:
        app: vps-mcp-gateway
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: tce-k3s-01
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 34001
        fsGroup: 34001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/phanthienquoc/vps-mcp-controller:REPLACE_WITH_VERIFIED_SHA_TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MCP_ALLOWED_HOST
              value: mcp.mrcute.space
            - name: ROOT_AGENT_SOCKET
              value: /run/vps-mcp/root-agent.sock
            - name: MCP_AUTH_DB_PATH
              value: /var/lib/vps-mcp-auth/auth.sqlite
            - name: MCP_OAUTH_ISSUER
              value: https://mcp.mrcute.space
            - name: MCP_RESOURCE_URL
              value: https://mcp.mrcute.space/mcp
            - name: MCP_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mcp-oauth-secrets
                  key: MCP_BOOTSTRAP_EMAIL
            - name: MCP_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-oauth-secrets
                  key: MCP_BOOTSTRAP_PASSWORD
            - name: MCP_OAUTH_SIGNING_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-oauth-secrets
                  key: MCP_OAUTH_SIGNING_PRIVATE_KEY
            - name: MCP_OAUTH_SIGNING_KID
              valueFrom:
                secretKeyRef:
                  name: mcp-oauth-secrets
                  key: MCP_OAUTH_SIGNING_KID
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: root-agent-socket
              mountPath: /run/vps-mcp
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: mcp-auth-data
              mountPath: /var/lib/vps-mcp-auth
      volumes:
        - name: root-agent-socket
          hostPath:
            path: /run/vps-mcp
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: mcp-auth-data
          persistentVolumeClaim:
            claimName: mcp-auth-data
